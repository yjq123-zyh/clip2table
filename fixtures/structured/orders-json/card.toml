schema = 2
name = "structured-orders"
channel = "http"
samples = "."

[fetch]
url = "https://example.test/orders?page={page}"

[segment]
mode = "json"
path = "/data/orders"

[fields.id]
kind = "json"
path = "/id"
type = "int"

[fields.amount]
kind = "json"
path = "/amount"

[dedupe]
key = ["id"]
mutable = ["amount"]
