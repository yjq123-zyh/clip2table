name: tests

# 只有 Windows 一种运行器，这不是偷懒：通道 C 直接调 Win32 API，
# 通道 B 靠窗口句柄把焦点还回去，在 Linux/macOS 上连模块都导不进来。
# 与其在别的平台上挂一个「跳过」的绿灯，不如老实说这个工具就是 Windows 工具。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 单元测试 · Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 零必需依赖，所以没有 pip install 这一步。装了什么都会掩盖「其实不需要装」。
      - name: 单元测试
        run: python -m unittest discover -s tests -t .

      - name: 文档里的命令与真实参数表对账
        run: python _dev/c2t.py selftest

      - name: 内置卡逐字节回归
        shell: pwsh
        run: |
          $cards = 'notice-list', 'admin-order-list', 'generic-item-block', 'job-list', 'numbered-list'
          foreach ($c in $cards) {
            Write-Host "--- $c"
            python _dev/c2t.py test $c
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

  package:
    name: 打包与干净安装
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 构建 sdist 与 wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # 打出来的包能不能自己跑，是「从 PyPI 装」和「从源码装」唯一的区别所在。
      # 内置卡的样本必须真的进了 wheel，否则装完就没有东西可回归。
      - name: 装进干净虚拟环境并自检
        shell: pwsh
        run: |
          python -m venv .venv-pkg
          $py = ".\.venv-pkg\Scripts\python.exe"
          $exe = ".\.venv-pkg\Scripts\clip2table.exe"
          & $py -m pip install --quiet (Get-ChildItem dist\*.whl).FullName
          & $exe -V
          & $exe cards list
          & $exe test notice-list

      # wheel 里只有代码，没有 SKILL.md 和 docs/。所以从装好的副本跑 selftest
      # 一定是「什么也没查到」——这种情况必须是失败，不能是「跳过，算通过」。
      # 之前就是这个样子：装好的副本一句「跳过对账」然后退出 0。
      - name: 装好的副本里 selftest 必须报错
        shell: pwsh
        run: |
          $exe = ".\.venv-pkg\Scripts\clip2table.exe"
          & $exe selftest
          if ($LASTEXITCODE -eq 0) {
            Write-Host "::error::装好的副本里没有文档，selftest 却报了成功——它在给自己发空头支票"
            exit 1
          }
          Write-Host "selftest 正确退出 $LASTEXITCODE"
          exit 0
