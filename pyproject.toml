[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "clip2table"
version = "0.4.1"
description = "从网页、桌面应用和 JSON 提取数据，按规则整理表格并持续更新业务台账"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{ name = "kdy", email = "yangdurant978@gmail.com" }]
keywords = ["clipboard", "table", "windows", "cdp", "csv", "xlsx", "data-extraction", "ledger"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Win32 (MS Windows)",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
  "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2"]

[project.scripts]
clip2table = "clip2table.cli:main"

[project.urls]
Homepage = "https://github.com/yjq123-zyh/clip2table"
Repository = "https://github.com/yjq123-zyh/clip2table"
Documentation = "https://github.com/yjq123-zyh/clip2table/blob/main/docs/usage.md"
Issues = "https://github.com/yjq123-zyh/clip2table/issues"
Changelog = "https://github.com/yjq123-zyh/clip2table/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Cards are the product, and their samples are what `clip2table test` runs
# against. Shipping the .toml without the samples/ tree means an installed
# copy cannot run its own regression -- the cards test green only from a
# checkout, which is the one place nobody needs the reassurance.
clip2table = [
  "cards/builtin/*.toml",
  "cards/builtin/samples/*/*.txt",
  "cards/builtin/samples/*/*.expect.tsv",
]

[tool.setuptools.data-files]
"share/clip2table/scenes/order-ledger" = ["scenes/order-ledger/*.toml", "scenes/order-ledger/*.md", "scenes/order-ledger/*.py"]
"share/clip2table/scenes/order-ledger/cards" = ["scenes/order-ledger/cards/*.toml"]
"share/clip2table/scenes/order-ledger/input" = ["scenes/order-ledger/input/*"]
"share/clip2table/scenes/order-ledger/output" = ["scenes/order-ledger/output/*"]
"share/clip2table/scenes/notice-list" = ["scenes/notice-list/*.toml", "scenes/notice-list/*.md"]
"share/clip2table/scenes/notice-list/input" = ["scenes/notice-list/input/*"]
"share/clip2table/scenes/notice-list/output" = ["scenes/notice-list/output/*"]
