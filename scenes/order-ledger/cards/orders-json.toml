schema = 2
name = "order-ledger-json"
channel = "http"
[fetch]
url = "http://127.0.0.1:8765/orders?page={page}"
[segment]
mode = "json"
path = '/orders'
[fields.'订单号']
kind = "json"
path = '/订单号'
[fields.'客户']
kind = "json"
path = '/客户'
[fields.'金额']
kind = "json"
path = '/金额'
[fields.'状态']
kind = "json"
path = '/状态'
[fields.'下单时间']
kind = "json"
path = '/下单时间'
[fields.'更新时间']
kind = "json"
path = '/更新时间'
[dedupe]
key = ["订单号"]
mutable = ["状态", "更新时间"]
[ledger]
sort = "business_time"
field = "更新时间"
timezone = "Asia/Shanghai"
