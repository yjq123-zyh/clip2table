schema = 2
name = "order-ledger-dom"
channel = "http"
[fetch]
url = "http://127.0.0.1:8765/orders?page={page}"
[segment]
mode = "dom"
region = '#orders'
records = 'article.order'
[fields.'订单号']
kind = "dom"
sel = '.id'
[fields.'客户']
kind = "dom"
sel = '.customer'
[fields.'金额']
kind = "dom"
sel = '.amount'
[fields.'状态']
kind = "dom"
sel = '.status'
[fields.'下单时间']
kind = "dom"
sel = '.ordered'
[fields.'更新时间']
kind = "dom"
sel = '.updated'
[dedupe]
key = ["订单号"]
mutable = ["状态", "更新时间"]
[ledger]
sort = "business_time"
field = "更新时间"
timezone = "Asia/Shanghai"
